name: Extract SiraQuiz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o SiraQuiz_GitHub_AAB_ready.zip -d extracted
          rsync -a --exclude='.github/' extracted/SiraQuiz/ ./
          rm -rf extracted

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract SiraQuiz project" || echo "Nothing to commit"
          git push
