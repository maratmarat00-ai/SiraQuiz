name: Build SiraQuiz AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q SiraQuiz_GitHub_AAB_ready.zip -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build AAB
        run: |
          gradle :app:bundleRelease
        working-directory: extracted/SiraQuiz

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SiraQuiz-release-AAB
          path: extracted/SiraQuiz/app/build/outputs/bundle/release/*.aab
